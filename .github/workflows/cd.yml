name: CD

on:
  push:
    tags:
      - '*/*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write # ghcr
  id-token: write # cosign

env:
  DOCKER_REGISTRY: ghcr.io
  ORG: bitmoa
  ENABLE_COSIGN: "1"

jobs:
  build_multiarch:
    name: Build per-arch
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    continue-on-error: true
    outputs:
      image_tag: ${{ steps.parse.outputs.image_tag }}
      dockerfile: ${{ steps.parse.outputs.dockerfile }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Parse tag and compute Dockerfile (same logic as containers policy)
        id: parse
        run: |
          bash ./.github/parse-tag.sh

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up buildx
        uses: docker/setup-buildx-action@v4

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.9.2
      - name: Cosign Version
        run: cosign version

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push single-arch image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ steps.parse.outputs.context_dir }}
          file: ${{ steps.parse.outputs.dockerfile }}
          platforms: linux/${{ matrix.arch }}
          push: true
          # append arch suffix to pushed tag so we can build manifest from succeeded platforms
          tags: ${{ steps.parse.outputs.image_tag }}-${{ matrix.arch }}

  deploy_manifest:
    name: Create manifest & sign
    runs-on: ubuntu-24.04
    needs: [ build_multiarch ]
    if: startsWith(github.ref, 'refs/tags/')
    outputs:
      name: ${{ steps.parse.outputs.name }}
      version: ${{ steps.parse.outputs.version }}
      version_prefix: ${{ steps.parse.outputs.version_prefix }}
      ostype: ${{ steps.parse.outputs.ostype }}
      osver: ${{ steps.parse.outputs.osver }}
      rev: ${{ steps.parse.outputs.rev }}
      image_base: ${{ steps.parse.outputs.image_base }}
      image_tag: ${{ steps.parse.outputs.image_tag }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install utilities & cosign
        run: |
          sudo apt-get -qq update
          sudo apt-get install -y jq
        # cosign installed next
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.9.2

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Parse tag (again)
        id: parse
        run: |
          bash ./.github/parse-tag.sh

      - name: Build manifest list from available platform images
        id: manifest
        run: |
          set -euo pipefail

          COSIGN_VERIFY_ARGS="--certificate-identity=https://github.com/bitmoa/containers/.github/workflows/cd.yml@${GITHUB_REF} --certificate-oidc-issuer=https://token.actions.githubusercontent.com"

          IMAGE_BASE="${{ steps.parse.outputs.image_base }}"
          IMAGE_TAG="${{ steps.parse.outputs.image_tag }}"
          
          PLATFORM_REFS=()
          # check amd64/arm64 and convert to repo@sha256:digest refs (skip manifest lists)
          for arch in amd64 arm64; do
            PLATFORM_DIGEST=$(docker manifest inspect "${IMAGE_TAG}-${arch}" | tee /dev/stderr | jq -r '.manifests.[] | select(.platform.architecture == "'${arch}'") | .digest' || true)
            if [ -n "${PLATFORM_DIGEST}" ]; then
              PLATFORM_REFS+=("${IMAGE_BASE}@${PLATFORM_DIGEST}")
            fi
          done

          if [ "${#PLATFORM_REFS[@]}" -eq 0 ]; then
            echo "No single-arch image digests available to create a manifest. Exiting without creating manifest."
            exit 1
          fi

          IMAGE_TAGS=("${IMAGE_TAG}")

          # Create additional variant manifests (e.g. 8.0.13, 8.0-debian-12, 8.0)
          VERSION="${{ steps.parse.outputs.version }}"
          VERSION_PREFIX="${{ steps.parse.outputs.version_prefix }}"
          OSTYPE="${{ steps.parse.outputs.ostype }}"
          OSVER="${{ steps.parse.outputs.osver }}"

          IMAGE_TAGS+=("${IMAGE_BASE}:${VERSION}" "${IMAGE_BASE}:${VERSION_PREFIX}-${OSTYPE}-${OSVER}" "${IMAGE_BASE}:${VERSION_PREFIX}")

          # deduplicate
          declare -A seen
          IMAGE_TAGS_SET=()
          for tag in "${IMAGE_TAGS[@]}"; do
            if [[ -z ${seen["$tag"]:-} ]]; then
              IMAGE_TAGS_SET+=("$tag")
              seen["$tag"]=1
            fi
          done

          for tag in "${IMAGE_TAGS_SET[@]}"; do
            echo "Creating manifest for ${tag} from: ${PLATFORM_REFS[*]}"
            docker manifest create "${tag}" "${PLATFORM_REFS[@]}"
            DIGEST_REF="$(docker manifest push "${tag}")"
            echo "Created manifest: ${DIGEST_REF}"
            if [ "${ENABLE_COSIGN:-}" == "1" ]; then
              cosign sign --yes "${tag}@${DIGEST_REF}"
              cosign verify "${tag}@${DIGEST_REF}" ${COSIGN_VERIFY_ARGS}
            fi
          done

  trigger_chart_update:
    name: Trigger chart bump & verification
    runs-on: ubuntu-24.04
    needs: [ deploy_manifest ]
    if: ${{ github.repository_owner == 'bitmoa' && startsWith(github.ref, 'refs/tags/') }}
    steps:
      - name: Generate token
        id: app-token
        uses: actions/create-github-app-token@v3.2.0
        with:
          client-id: ${{ secrets.SYNC_BOT_CLIENT_ID }}
          private-key: ${{ secrets.SYNC_BOT_PRIVATE_KEY }}
      
      # Hands the freshly published image over to bitmoa/charts, which bumps
      # every chart referencing it, installs them on k3s and only commits once
      # the pods are verified healthy. See charts/.github/workflows/image-bump.yml
      - name: Dispatch container-image-published to bitmoa/charts
        env:
          GH_TOKEN: ${{ secrets.BITMOA_BOT_TOKEN || steps.app-token.outputs.token }}
          IMAGE_NAME: ${{ needs.deploy_manifest.outputs.name }}
          VERSION: ${{ needs.deploy_manifest.outputs.version }}
          VERSION_PREFIX: ${{ needs.deploy_manifest.outputs.version_prefix }}
          OSTYPE: ${{ needs.deploy_manifest.outputs.ostype }}
          OSVER: ${{ needs.deploy_manifest.outputs.osver }}
          REV: ${{ needs.deploy_manifest.outputs.rev }}
          IMAGE_BASE: ${{ needs.deploy_manifest.outputs.image_base }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::warning::BITMOA_BOT_TOKEN is not configured - skipping chart update dispatch"
            exit 0
          fi

          TAG="${VERSION}-${OSTYPE}-${OSVER}-${REV}"
          echo "Dispatching ${IMAGE_BASE}:${TAG} to bitmoa/charts"

          jq -n \
            --arg image "${IMAGE_NAME}" \
            --arg tag "${TAG}" \
            --arg version "${VERSION}" \
            --arg version_prefix "${VERSION_PREFIX}" \
            --arg ostype "${OSTYPE}" \
            --arg osver "${OSVER}" \
            --arg rev "${REV}" \
            --arg image_base "${IMAGE_BASE}" \
            --arg source_tag "${GITHUB_REF#refs/tags/}" \
            --arg source_run "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            '{event_type: "container-image-published", client_payload: {
                image: $image, tag: $tag, version: $version,
                version_prefix: $version_prefix, ostype: $ostype, osver: $osver,
                rev: $rev, image_base: $image_base,
                source_tag: $source_tag, source_run: $source_run
            }}' > /tmp/dispatch.json

          gh api --method POST /repos/bitmoa/charts/dispatches --input /tmp/dispatch.json
          echo "Dispatched. Follow up at ${GITHUB_SERVER_URL}/bitmoa/charts/actions/workflows/image-bump.yml"
