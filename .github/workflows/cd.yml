name: CD

# Entry point for image tags ({app}/{version}). The actual build/sign/publish
# lives in cd-pipeline.yml; this wrapper only exists to serialise runs per app:
#   - one pipeline per app at a time (other apps still run in parallel)
#   - queued runs for the same app wait in FIFO order instead of the default
#     "newest pending cancels older pending" behaviour (queue: max)
# A wrapper is needed because workflow-level concurrency can't derive the app
# name from the tag (expressions have no split()), but job-level concurrency
# can read it from a previous job's outputs.

on:
  push:
    tags:
      - '*/*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve:
    name: Resolve app name
    runs-on: ubuntu-24.04
    outputs:
      app: ${{ steps.app.outputs.app }}
    steps:
      - id: app
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          # "clickhouse/26.8.22-debian-12-r1" -> "clickhouse"; non-tag refs
          # (workflow_dispatch on a branch) get their own group.
          if [[ "${GITHUB_REF}" == refs/tags/*/* ]]; then
            echo "app=${REF_NAME%%/*}" >> "$GITHUB_OUTPUT"
          else
            echo "app=_ref-${REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

  pipeline:
    name: CD pipeline
    needs: [ resolve ]
    concurrency:
      group: cd-${{ needs.resolve.outputs.app }}
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      packages: write # ghcr
      id-token: write # cosign
    uses: ./.github/workflows/cd-pipeline.yml
    secrets: inherit
